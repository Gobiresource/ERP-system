<!doctype html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ERP</title>
    <script>
      // Paint the right background before the app loads: dark only when the person chose it, light otherwise.
      try {
        var s = JSON.parse(localStorage.getItem('erp:v1') || 'null');
        document.documentElement.dataset.mode = s && s.settings && s.settings.theme === 'dark' ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
