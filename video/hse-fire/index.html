<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<title>Кемпэд гал гарвал</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/golos-text/index.css">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #EEF1F4;
               font-family: "Golos Text Variable", sans-serif; color: #1F2429; }
  #top { position: absolute; left: 72px; right: 72px; top: 150px; height: 330px; }
  .kicker { font-size: 30px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: #5B6670; }
  .cap { position: absolute; left: 0; right: 0; top: 64px; display: flex; gap: 28px; align-items: flex-start; }
  .badge { flex: none; width: 92px; height: 92px; border-radius: 26px; background: #D52B1E; color: #fff;
           display: grid; place-items: center; font-size: 54px; font-weight: 760; font-feature-settings: "tnum"; }
  .cap__text { font-size: 76px; font-weight: 760; line-height: 1.08; letter-spacing: -.015em; text-wrap: balance; }
  #card { position: absolute; left: 40px; top: 520px; width: 1000px; height: 940px; border-radius: 40px; overflow: hidden;
          background: #FBFCFC; box-shadow: 0 2px 0 rgba(31,36,41,.04), 0 24px 60px rgba(31,36,41,.10); }
  #view { position: absolute; inset: 0; }
  #sub { position: absolute; left: 72px; right: 72px; top: 1520px; height: 300px; font-size: 46px; font-weight: 560;
         line-height: 1.34; text-wrap: pretty; }
  #sub span { transition: none; }
  #end { position: absolute; left: 0; right: 0; top: 1540px; display: flex; justify-content: center; }
  .pill { display: flex; align-items: center; gap: 36px; padding: 30px 54px; border-radius: 34px; background: #D52B1E; color: #fff;
          box-shadow: 0 20px 50px rgba(213,43,30,.28); }
  .pill b { font-size: 56px; font-weight: 650; }
  .pill strong { font-size: 104px; font-weight: 820; letter-spacing: .01em; font-feature-settings: "tnum"; }
</style>
</head>
<body>
<div id="top"><div class="kicker" id="kicker"></div><div class="cap" id="capA"></div><div class="cap" id="capB"></div></div>
<div id="card"><svg id="view" width="1000" height="940" viewBox="0 0 1000 940"><g id="cam"><g id="plan" font-family="Golos, sans-serif"></g><g id="fx"></g></g></svg></div>
<div id="sub"></div>
<div id="end"><div class="pill"><b>Гал түймэр</b><strong>101</strong></div></div>
<script type="module" src="./scene.js"></script>
</body>
</html>
