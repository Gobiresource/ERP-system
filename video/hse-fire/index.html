<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<title>Кемпэд гал гарвал</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/golos-text/index.css">
<script type="importmap">
{ "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }
</script>
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #DDE3E8;
               font-family: "Golos Text Variable", sans-serif; color: #fff; }
  #gl { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  #shade { position: absolute; left: 0; right: 0; top: 0; height: 560px;
           background: linear-gradient(rgba(11,15,20,.78), rgba(11,15,20,.55) 42%, rgba(11,15,20,0)); }
  #top { position: absolute; left: 72px; right: 72px; top: 132px; }
  .cap { position: absolute; left: 0; right: 0; top: 0; }
  .kicker { display: flex; align-items: center; gap: 18px; font-size: 25px; font-weight: 650; letter-spacing: .09em;
            text-transform: uppercase; color: rgba(255,255,255,.82); }
  .kicker::before { content: ""; width: 36px; height: 5px; border-radius: 3px; background: #E8402F; }
  .row { display: flex; gap: 28px; align-items: flex-start; margin-top: 28px; }
  .badge { flex: none; width: 76px; height: 76px; margin-top: 4px; border-radius: 22px; background: #D52B1E; color: #fff;
           display: grid; place-items: center; font-size: 44px; font-weight: 760; font-feature-settings: "tnum"; }
  .cap__text, .title { text-wrap: balance; text-shadow: 0 2px 20px rgba(0,0,0,.3); }
  .cap__text { font-size: 66px; font-weight: 760; line-height: 1.1; letter-spacing: -.012em; }
  .title { font-size: 86px; font-weight: 800; line-height: 1.04; letter-spacing: -.02em; }
  .title::after { content: ""; display: block; width: 104px; height: 8px; margin-top: 34px; border-radius: 4px; background: #E8402F; }
  #end { position: absolute; left: 0; right: 0; top: 1540px; display: flex; justify-content: center; }
  .pill { display: flex; align-items: center; gap: 36px; padding: 30px 54px; border-radius: 34px; background: #D52B1E; color: #fff;
          box-shadow: 0 20px 50px rgba(213,43,30,.28); }
  .pill b { font-size: 56px; font-weight: 650; }
  .pill strong { font-size: 104px; font-weight: 820; letter-spacing: .01em; font-feature-settings: "tnum"; }
</style>
</head>
<body>
<canvas id="gl" width="1080" height="1920"></canvas>
<div id="shade"></div>
<div id="top"><div class="cap" id="capA"></div><div class="cap" id="capB"></div></div>
<div id="end"><div class="pill"><b>Гал түймэр</b><strong>101</strong></div></div>
<script type="module" src="./scene.js"></script>
</body>
</html>
